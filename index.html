<style>
:root{--bg:#0a0a0a;--s:#1a1a1a;--el:#242424;--ac:#ff6b35;--ac2:#f7931e;--g:#4ade80;--r:#f87171;--blue:#60a5fa;--purple:#a78bfa;--text:#f5f5f5;--muted:#999;--border:#333;--radius:12px}

body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;direction:rtl;min-height:100vh}

.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--ac);letter-spacing:1px;margin-left:auto}
nav a{color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;padding:.4rem .8rem;border-radius:6px;transition:color .2s,background .2s}
nav a:hover{color:var(--text);background:var(--border)}
nav a.active{color:var(--ac);font-weight:600;border-bottom:2px solid var(--ac)}
main{max-width:840px;margin:0 auto;padding:2rem 1.5rem}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:2px;margin-bottom:.25rem}

@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}}
.kpi-card{background:var(--s);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem}
.kpi-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:1.8rem;font-weight:600}
.kpi-val.green{color:var(--g)}
.kpi-val.red{color:var(--r)}
.kpi-val.orange{color:var(--ac)}
.kpi-note{font-size:.75rem;color:var(--muted);margin-top:.4rem}
.chart-card{background:var(--s);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.chart-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;margin-bottom:1rem;color:var(--text)}
.chart-wrap{position:relative;height:280px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1px;margin-bottom:1rem;margin-top:2rem;color:var(--ac)}
.income-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
@media(max-width:600px){.income-grid{grid-template-columns:1fr}}
.income-card{background:var(--s);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.5rem}
.income-name{font-size:.8rem;color:var(--muted)}
.income-amount{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:600;color:var(--g)}
.income-note{font-size:.75rem;color:var(--muted)}
.habits-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:2rem}
@media(max-width:900px){.habits-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.habits-grid{grid-template-columns:1fr}}
.habit-card{background:var(--s);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.habit-n{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ac);margin-bottom:.5rem}
.habit-title{font-size:.9rem;font-weight:600;margin-bottom:.4rem;line-height:1.3}
.habit-desc{font-size:.78rem;color:var(--muted);line-height:1.4}
.upcoming-list{display:flex;flex-direction:column;gap:.75rem;margin-bottom:2rem}
.upcoming-item{background:var(--s);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.upcoming-name{font-size:.9rem;font-weight:500}
.upcoming-date{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--muted)}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:4px;font-size:.72rem;font-weight:600}
.badge-critical{background:rgba(248,113,113,.15);color:var(--r);border:1px solid rgba(248,113,113,.3)}
.badge-high{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.badge-goal{background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid rgba(96,165,250,.3)}
.badge-saving{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
</style>

<main>
<div id="lockScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a">
  <div style="background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:3rem 2.5rem;width:min(380px,90vw);text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.6)">
    <div style="font-size:2.8rem;margin-bottom:1rem;line-height:1">🔒</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:2px;color:#ff6b35;margin-bottom:.4rem">WINTER FINANCE</div>

    <input id="pwInput" type="password" placeholder="הכנס סיסמה..." autocomplete="current-password"

      onfocus="this.style.borderColor='#ff6b35'" onblur="this.style.borderColor='#444'"

      onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
      פתח
    </button>

    <div style="margin-top:1.5rem;font-size:.72rem;color:#555;line-height:1.5">הנתונים מוצפנים · AES-256-GCM · PBKDF2</div>
  </div>

<div id="app" style="display:none"></div>
</main>


<script>
(function(){
'use strict';
var F='12px "Space Grotesk",sans-serif',FS='10px "Space Grotesk",sans-serif',FX='9px "Space Grotesk",sans-serif';
function setup(id){
  var cv=document.getElementById(id);if(!cv)return null;
  var p=cv.parentElement,W=p.offsetWidth,H=p.offsetHeight,dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  var x=cv.getContext('2d');x.scale(dpr,dpr);return{x:x,W:W,H:H};
}
function k(v){var a=Math.abs(v);return a>=1000?(v/1000).toFixed(0)+'k':Math.round(v).toString();}

/* Horizontal bar -------------------------------------------------- */
window.hbar=function(id,labels,vals,colors){
  var s=setup(id);if(!s)return;
  var x=s.x,W=s.W,H=s.H,n=labels.length;
  var PL=155,PR=58,PT=10,PB=10;
  var cW=W-PL-PR,rh=(H-PT-PB)/n,bh=Math.min(rh*0.55,26);
  var mx=Math.max.apply(null,vals);
  x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);
  for(var i=0;i<n;i++){
    var cy=PT+i*rh+rh/2,bw=(vals[i]/mx)*cW;
    x.fillStyle=colors[i]||'#60a5fa';
    x.beginPath();
    if(x.roundRect)x.roundRect(PL,cy-bh/2,bw,bh,3);else x.rect(PL,cy-bh/2,bw,bh);
    x.fill();
    x.fillStyle='#f5f5f5';x.font=FS;x.textAlign='right';x.textBaseline='middle';
    x.fillText(labels[i],PL-8,cy);
    x.fillStyle='#ccc';x.font=FS;x.textAlign='left';x.textBaseline='middle';
    x.fillText('₪'+k(vals[i]),PL+bw+5,cy-5);
    x.fillStyle='#666';x.font=FX;x.textBaseline='middle';
    x.fillText((vals[i]/mx*100).toFixed(1)+'%',PL+bw+5,cy+7);
  }
};

/* Doughnut -------------------------------------------------------- */
window.donut=function(id,labels,vals,colors){
  var s=setup(id);if(!s)return;
  var x=s.x,W=s.W,H=s.H;
  var total=vals.reduce(function(a,b){return a+b;},0);
  var cols=3,rows=Math.ceil(labels.length/cols),legH=rows*18+10;
  var cH=H-legH,cx=W/2,cy=cH/2,r=Math.min(cx-10,cH/2-10),inner=r*0.58;
  x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);
  var ang=-Math.PI/2;
  for(var i=0;i<vals.length;i++){
    var sl=(vals[i]/total)*Math.PI*2;
    x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,ang,ang+sl);x.closePath();
    x.fillStyle=colors[i];x.fill();ang+=sl;
  }
  x.beginPath();x.arc(cx,cy,inner,0,Math.PI*2);x.fillStyle='#0a0a0a';x.fill();
  var ang2=-Math.PI/2;
  for(var i=0;i<vals.length;i++){
    var sl2=(vals[i]/total)*Math.PI*2;
    if(vals[i]/total*100>=5){
      var midA=ang2+sl2/2,tr=(r+inner)/2;
      var tx=cx+Math.cos(midA)*tr,ty=cy+Math.sin(midA)*tr;
      x.fillStyle='rgba(255,255,255,0.9)';x.font='bold '+FS;
      x.textAlign='center';x.textBaseline='middle';
      x.fillText((vals[i]/total*100).toFixed(1)+'%',tx,ty);
    }
    ang2+=sl2;
  }
  var lw=W/cols;
  for(var i=0;i<labels.length;i++){
    var col=i%cols,row=Math.floor(i/cols);
    var lx=col*lw+8,ly=H-legH+row*18+8;
    x.fillStyle=colors[i];x.fillRect(lx,ly,10,10);
    x.fillStyle='#888';x.font=FX;x.textAlign='left';x.textBaseline='top';
    var txt=labels[i].length>14?labels[i].substring(0,13)+'…':labels[i];
    x.fillText(txt,lx+13,ly+1);
  }
};

/* Vertical bar + optional line ------------------------------------ */
window.vbar=function(id,labels,datasets){
  var s=setup(id);if(!s)return;
  var x=s.x,W=s.W,H=s.H;
  var PL=46,PR=8,PT=16,PB=46;
  var cW=W-PL-PR,cH=H-PT-PB,n=labels.length;
  var barDS=[],lineDS=[];
  for(var i=0;i<datasets.length;i++)(datasets[i].type==='line'?lineDS:barDS).push(datasets[i]);
  var allV=[];for(var i=0;i<datasets.length;i++)allV=allV.concat(datasets[i].data);
  var mn=Math.min.apply(null,allV),mx=Math.max.apply(null,allV),range=mx-mn||1;
  function yp(v){return PT+((mx-v)/range)*cH;}
  function xp(i){return PL+(i+0.5)*(cW/n);}
  x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);
  for(var gi=0;gi<=4;gi++){
    var gy=PT+gi*(cH/4),gv=mx-(range*gi/4);
    x.strokeStyle='#333';x.lineWidth=1;
    x.beginPath();x.moveTo(PL,gy);x.lineTo(W-PR,gy);x.stroke();
    x.fillStyle='#888';x.font=FX;x.textAlign='right';x.textBaseline='middle';
    x.fillText('₪'+k(gv),PL-3,gy);
  }
  if(mn<0&&mx>0){
    var zy=yp(0);x.strokeStyle='#555';x.lineWidth=1;
    x.beginPath();x.moveTo(PL,zy);x.lineTo(W-PR,zy);x.stroke();
  }
  var nbars=Math.max(barDS.length,1),bw=(cW/n)*0.72/nbars;
  for(var di=0;di<barDS.length;di++){
    var ds=barDS[di];
    for(var i=0;i<ds.data.length;i++){
      var v=ds.data[i];
      var bx=xp(i)+(di-nbars/2+0.5)*bw;
      var top=yp(Math.max(v,0)),bot=yp(Math.min(v,0)),bh=Math.max(Math.abs(bot-top),2);
      x.fillStyle=ds.color;x.beginPath();
      if(x.roundRect)x.roundRect(bx-bw/2,top,bw,bh,2);else x.rect(bx-bw/2,top,bw,bh);
      x.fill();
    }
  }
  for(var di=0;di<lineDS.length;di++){
    var ds=lineDS[di];
    x.strokeStyle=ds.color;x.lineWidth=2.5;x.lineJoin='round';x.beginPath();
    for(var i=0;i<ds.data.length;i++){
      var px=xp(i),py=yp(ds.data[i]);i===0?x.moveTo(px,py):x.lineTo(px,py);
    }
    x.stroke();
    for(var i=0;i<ds.data.length;i++){
      x.fillStyle=ds.data[i]>=0?'#4ade80':'#f87171';
      x.beginPath();x.arc(xp(i),yp(ds.data[i]),3.5,0,Math.PI*2);x.fill();
    }
    for(var i=0;i<ds.data.length;i++){
      var lv=ds.data[i];
      x.fillStyle=lv>=0?'#4ade80':'#f87171';x.font=FX;x.textAlign='center';
      x.textBaseline=lv>=0?'bottom':'top';
      x.fillText(k(lv),xp(i),yp(lv)+(lv>=0?-8:8));
    }
  }
  for(var i=0;i<labels.length;i++){
    x.fillStyle='#888';x.font=FX;x.textAlign='center';x.textBaseline='top';
    x.fillText(labels[i],xp(i),H-PB+5);
  }
  var legX=PL,legY=H-8;
  for(var i=0;i<datasets.length;i++){
    var ds=datasets[i];if(!ds.label)continue;
    x.strokeStyle=ds.color;x.lineWidth=2.5;x.setLineDash([]);
    if(ds.type==='line'){x.beginPath();x.moveTo(legX,legY);x.lineTo(legX+16,legY);x.stroke();}
    else{x.fillStyle=ds.color;x.fillRect(legX,legY-4,16,8);}
    x.fillStyle='#888';x.font=FX;x.textAlign='left';x.textBaseline='middle';
    x.fillText(ds.label,legX+20,legY);legX+=ds.label.length*5.5+28;
  }
};

/* Simple vertical bar (single series) ---------------------------- */
window.sbar=function(id,labels,vals,colors){
  var s=setup(id);if(!s)return;
  var x=s.x,W=s.W,H=s.H,n=labels.length;
  var PL=8,PR=42,PT=16,PB=38;
  var cW=W-PL-PR,cH=H-PT-PB,bw=(cW/n)*0.6;
  var mx=Math.max.apply(null,vals);
  x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);
  for(var gi=1;gi<=4;gi++){
    var gy=PT+(1-gi/4)*cH,gv=(mx*gi/4);
    x.strokeStyle='#333';x.lineWidth=1;
    x.beginPath();x.moveTo(PL,gy);x.lineTo(W-PR,gy);x.stroke();
    x.fillStyle='#888';x.font=FX;x.textAlign='left';x.textBaseline='middle';
    x.fillText('₪'+k(gv),W-PR+3,gy);
  }
  for(var i=0;i<n;i++){
    var bx=PL+(i+0.5)*(cW/n),bh=(vals[i]/mx)*cH,by=PT+cH-bh;
    x.fillStyle=colors[i];x.beginPath();
    if(x.roundRect)x.roundRect(bx-bw/2,by,bw,bh,3);else x.rect(bx-bw/2,by,bw,bh);
    x.fill();
    x.fillStyle='#888';x.font=FX;x.textAlign='center';x.textBaseline='top';
    x.fillText(labels[i],bx,H-PB+4);
    x.fillStyle='#bbb';x.font=FX;x.textBaseline='bottom';
    x.fillText('₪'+k(vals[i]),bx,by-2);
  }
};

/* Line chart (trajectory) ---------------------------------------- */
window.linechart=function(id,labels,datasets){
  var s=setup(id);if(!s)return;
  var x=s.x,W=s.W,H=s.H;
  var PL=54,PR=12,PT=16,PB=46;
  var cW=W-PL-PR,cH=H-PT-PB,n=labels.length;
  var allV=[];for(var i=0;i<datasets.length;i++)allV=allV.concat(datasets[i].data);
  var mx=Math.max.apply(null,allV),range=mx||1;
  function yp(v){return PT+((mx-v)/range)*cH;}
  function xp(i){return PL+(i/(n-1))*cW;}
  x.fillStyle='#0a0a0a';x.fillRect(0,0,W,H);
  for(var gi=0;gi<=4;gi++){
    var gy=PT+gi*(cH/4),gv=mx*(1-gi/4);
    x.strokeStyle='#333';x.lineWidth=1;
    x.beginPath();x.moveTo(PL,gy);x.lineTo(W-PR,gy);x.stroke();
    x.fillStyle='#888';x.font=FX;x.textAlign='right';x.textBaseline='middle';
    x.fillText('₪'+k(gv),PL-4,gy);
  }
  for(var di=0;di<datasets.length;di++){
    var ds=datasets[di];
    if(ds.fillColor){
      x.fillStyle=ds.fillColor;x.beginPath();
      x.moveTo(xp(0),yp(ds.data[0]));
      for(var i=1;i<ds.data.length;i++)x.lineTo(xp(i),yp(ds.data[i]));
      x.lineTo(xp(ds.data.length-1),yp(0));x.lineTo(xp(0),yp(0));
      x.closePath();x.fill();
    }
    if(ds.dash)x.setLineDash(ds.dash);else x.setLineDash([]);
    x.strokeStyle=ds.color;x.lineWidth=2.5;x.lineJoin='round';x.beginPath();
    for(var i=0;i<ds.data.length;i++){
      i===0?x.moveTo(xp(i),yp(ds.data[i])):x.lineTo(xp(i),yp(ds.data[i]));
    }
    x.stroke();x.setLineDash([]);
    x.fillStyle=ds.color;
    for(var i=0;i<ds.data.length;i++){
      x.beginPath();x.arc(xp(i),yp(ds.data[i]),3.5,0,Math.PI*2);x.fill();
    }
  }
  var step=Math.max(1,Math.floor(n/7));
  for(var i=0;i<n;i++){
    if(i%step!==0&&i!==n-1)continue;
    x.fillStyle='#888';x.font=FX;x.textAlign='center';x.textBaseline='top';
    x.fillText(labels[i],xp(i),H-PB+5);
  }
  var legX=PL,legY=H-10;
  for(var i=0;i<datasets.length;i++){
    var ds=datasets[i];if(!ds.label)continue;
    x.strokeStyle=ds.color;x.lineWidth=2;
    if(ds.dash)x.setLineDash(ds.dash);else x.setLineDash([]);
    x.beginPath();x.moveTo(legX,legY);x.lineTo(legX+18,legY);x.stroke();
    x.setLineDash([]);
    x.fillStyle='#888';x.font=FX;x.textAlign='left';x.textBaseline='middle';
    x.fillText(ds.label,legX+22,legY);legX+=ds.label.length*5.8+36;
  }
};
})();

async function wfKey(pw,salt){
  var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function wfTry(enc,pw){
  try{
    var s=Uint8Array.from(atob(enc.s),function(c){return c.charCodeAt(0);});
    var v=Uint8Array.from(atob(enc.v),function(c){return c.charCodeAt(0);});
    var d=Uint8Array.from(atob(enc.d),function(c){return c.charCodeAt(0);});
    var k=await wfKey(pw,s);
    var r=await crypto.subtle.decrypt({name:'AES-GCM',iv:v},k,d);
    return new TextDecoder().decode(r);
  }catch(e){return null;}
}
async function tryUnlock(){
  var pw=document.getElementById('pwInput').value;
  if(!pw)return;
  var err=document.getElementById('lockErr');
  var btn=document.getElementById('unlockBtn');
  err.textContent='';btn.textContent='...';btn.disabled=true;
  var result=null;
  for(var i=0;i<WF_ENC.length&&!result;i++)result=await wfTry(WF_ENC[i],pw);
  if(result){
    sessionStorage.setItem('wf_k',pw);
    applyContent(result);
  }else{
    err.textContent='סיסמה שגויה ❌';
    btn.textContent='פתח';btn.disabled=false;
    var inp=document.getElementById('pwInput');
    inp.style.borderColor='#f87171';
    setTimeout(function(){inp.style.borderColor='#444';},1500);
  }
}
function applyContent(json){
  var p=JSON.parse(json);
  document.getElementById('lockScreen').remove();
  var app=document.getElementById('app');
  app.style.display='';
  app.innerHTML=p.html;
  var lo=document.getElementById('navLogout');
  if(lo)lo.style.display='inline-block';
  var sc=document.createElement('script');
  sc.textContent=p.js;
  document.body.appendChild(sc);
}
function logout(){
  sessionStorage.removeItem('wf_k');
  location.reload();
}
window.addEventListener('DOMContentLoaded',async function(){
  var k=sessionStorage.getItem('wf_k');
  if(k){
    var result=null;
    for(var i=0;i<WF_ENC.length&&!result;i++)result=await wfTry(WF_ENC[i],k);
    if(result){applyContent(result);return;}
    sessionStorage.removeItem('wf_k');
  }
  var inp=document.getElementById('pwInput');
  if(inp)inp.focus();
});
</script>
